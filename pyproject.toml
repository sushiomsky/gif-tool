[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gif-tool"
version = "1.0.0"
description = "Unified GIF creation toolkit: video->GIF, frame stitching, service sync, prompt building, captcha helpers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sushiomsky" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.scripts]
gif-tool = "lib.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["lib", "lib.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
